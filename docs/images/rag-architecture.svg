<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">RAG Knowledge Assistant architecture</title>
  <desc id="desc">Browser and API clients connect to FastAPI, which routes credential-free search to TF-IDF retrieval and semantic search to an embedding provider and PostgreSQL with pgvector. Retrieved passages feed grounded cited answers. Health, readiness, CI and OpenTelemetry support operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16213a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.24"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/></marker>
    <style>.title{font:700 38px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:400 18px Inter,Arial,sans-serif;fill:#b8c5d6}.h{font:700 20px Inter,Arial,sans-serif;fill:#f8fafc}.p{font:400 15px Inter,Arial,sans-serif;fill:#d4deea}.small{font:600 13px Inter,Arial,sans-serif;fill:#9fb3c8}.line{stroke:#9fb3c8;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="760" rx="30" fill="url(#bg)"/>
  <text x="70" y="72" class="title">RAG Knowledge Assistant — Production Architecture</text><text x="70" y="108" class="sub">Transparent local retrieval + verified PostgreSQL/pgvector semantic path</text>
  <g filter="url(#shadow)"><rect x="70" y="180" width="220" height="120" rx="22" fill="#1f2d46" stroke="#4f6d91"/><text x="180" y="226" text-anchor="middle" class="h">Browser / API Client</text><text x="180" y="258" text-anchor="middle" class="p">Web UI · curl · REST</text></g>
  <g filter="url(#shadow)"><rect x="390" y="165" width="250" height="150" rx="24" fill="#1d4f73" stroke="#5fc2ff" stroke-width="2"/><text x="515" y="218" text-anchor="middle" class="h">FastAPI</text><text x="515" y="250" text-anchor="middle" class="p">/search · /semantic-search</text><text x="515" y="276" text-anchor="middle" class="p">/answer · /health · /readiness</text></g>
  <g filter="url(#shadow)"><rect x="760" y="145" width="260" height="120" rx="22" fill="#243b53" stroke="#6b8eae"/><text x="890" y="190" text-anchor="middle" class="h">TF-IDF Baseline</text><text x="890" y="222" text-anchor="middle" class="p">Credential-free cosine ranking</text></g>
  <g filter="url(#shadow)"><rect x="760" y="320" width="260" height="120" rx="22" fill="#3a3153" stroke="#a78bfa"/><text x="890" y="365" text-anchor="middle" class="h">Embedding Provider</text><text x="890" y="397" text-anchor="middle" class="p">OpenAI-compatible adapter</text></g>
  <g filter="url(#shadow)"><rect x="1120" y="300" width="220" height="160" rx="24" fill="#173f35" stroke="#4ade80"/><text x="1230" y="350" text-anchor="middle" class="h">PostgreSQL 16</text><text x="1230" y="382" text-anchor="middle" class="p">pgvector persistence</text><text x="1230" y="408" text-anchor="middle" class="p">HNSW cosine index</text><text x="1230" y="434" text-anchor="middle" class="small">verified in GitHub Actions</text></g>
  <g filter="url(#shadow)"><rect x="760" y="515" width="260" height="120" rx="22" fill="#5b3a1f" stroke="#f6ad55"/><text x="890" y="560" text-anchor="middle" class="h">Grounded Context</text><text x="890" y="592" text-anchor="middle" class="p">Top-k source passages</text></g>
  <g filter="url(#shadow)"><rect x="1120" y="515" width="220" height="120" rx="22" fill="#4b2748" stroke="#f472b6"/><text x="1230" y="560" text-anchor="middle" class="h">Chat Model</text><text x="1230" y="592" text-anchor="middle" class="p">Cited answer generation</text></g>
  <g filter="url(#shadow)"><rect x="390" y="515" width="250" height="120" rx="22" fill="#253044" stroke="#7c91ad"/><text x="515" y="558" text-anchor="middle" class="h">Operations</text><text x="515" y="588" text-anchor="middle" class="p">OpenTelemetry · Docker</text><text x="515" y="614" text-anchor="middle" class="p">CI · benchmark artifacts</text></g>
  <path class="line" d="M290 240 H390"/><path class="line" d="M640 220 H760"/><path class="line" d="M640 265 C700 265 700 380 760 380"/><path class="line" d="M1020 380 H1120"/><path class="line" d="M1230 460 V515"/><path class="line" d="M1020 575 H1120"/><path class="line" d="M760 575 H640"/><path class="line" d="M515 315 V515"/>
  <text x="675" y="205" class="small">local search</text><text x="666" y="347" class="small">semantic path</text><text x="1050" y="365" class="small">vectors</text><text x="1180" y="492" class="small">retrieved passages</text><text x="1038" y="554" class="small">context</text><text x="650" y="555" class="small">answers + telemetry</text>
</svg>
