name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4

  dependency-audit-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install production project and auditor
        run: python -m pip install --upgrade pip ".[production]" pip-audit
      - name: Audit dependencies
        run: pip-audit --local
      - name: Generate CycloneDX SBOM
        run: pip-audit --local --format cyclonedx-json --output sbom.cdx.json || true
      - uses: actions/upload-artifact@v7
        with:
          name: rag-knowledge-assistant-sbom
          path: sbom.cdx.json

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build -f Dockerfile.production -t rag-knowledge-assistant:security .
      - name: Scan image for high/critical vulnerabilities
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 image --exit-code 1 --severity HIGH,CRITICAL rag-knowledge-assistant:security
