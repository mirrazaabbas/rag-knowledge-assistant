name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app.py api.py providers.py storage.py benchmark.py integration_contract.py tests

      - name: Lint
        run: ruff check . --output-format=github

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80

      - name: CLI smoke test
        run: python app.py "How can AI agents reduce unsupported claims?" --top-k 1

      - name: Import API
        run: python -c "import api; assert api.health()['status'] == 'ok'"

      - name: Validate portfolio evidence contract
        run: python -c "import integration_contract as c; r=c.build_evaluation_record('q','a',[{'source':'s','text':'t'}]); assert not c.validate_evaluation_record(r)"

      - name: Provider configuration fails safely without secrets
        run: |
          if env -u OPENAI_API_KEY python -c "import providers; providers.ProviderConfig.from_env()"; then
            echo "Expected missing-key configuration to fail"
            exit 1
          fi

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build production image
        run: docker build -f Dockerfile.production -t rag-knowledge-assistant:ci .

      - name: Run production image on platform-style PORT
        run: |
          docker run -d --name rag-container-ci -e PORT=10000 -p 10000:10000 rag-knowledge-assistant:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:10000/health >/dev/null; then
              curl --fail --silent http://127.0.0.1:10000/readiness
              exit 0
            fi
            sleep 1
          done
          docker logs rag-container-ci
          exit 1

      - name: Stop production image
        if: always()
        run: docker rm -f rag-container-ci || true

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      VECTOR_DIMENSIONS: "2"
      RUN_PGVECTOR_INTEGRATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt -r requirements-dev.txt

      - name: Run pgvector integration tests
        run: python -m unittest tests.test_pgvector_integration -v

      - name: Run retrieval benchmark
        run: python benchmark.py --database-url "$DATABASE_URL" --output benchmark-results.json

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-benchmark-results
          path: benchmark-results.json

  observability-integration:
    runs-on: ubuntu-latest
    services:
      jaeger:
        image: cr.jaegertracing.io/jaegertracing/jaeger:2.20.0
        ports:
          - 4318:4318
          - 16686:16686

    env:
      OTEL_ENABLED: "true"
      OTEL_SERVICE_NAME: rag-knowledge-assistant-ci
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://127.0.0.1:4318/v1/traces

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt

      - name: Send a FastAPI trace to Jaeger
        run: |
          uvicorn api:app --host 127.0.0.1 --port 8010 >uvicorn-otel.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8010/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8010/health >/dev/null

          sleep 7

          for attempt in {1..15}; do
            SERVICES=$(curl --fail --silent http://127.0.0.1:16686/api/services || true)
            if echo "$SERVICES" | grep -q "rag-knowledge-assistant-ci"; then
              echo "$SERVICES"
              exit 0
            fi
            sleep 1
          done

          cat uvicorn-otel.log
          curl --silent http://127.0.0.1:16686/api/services || true
          exit 1
