name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app.py api.py providers.py storage.py tests

      - name: Lint
        run: ruff check . --output-format=github

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report --fail-under=80

      - name: CLI smoke test
        run: python app.py "How can AI agents reduce unsupported claims?" --top-k 1

      - name: Import API
        run: python -c "import api; assert api.health()['status'] == 'ok'"

      - name: Provider configuration fails safely without secrets
        run: |
          if env -u OPENAI_API_KEY python -c "import providers; providers.ProviderConfig.from_env()"; then
            echo "Expected missing-key configuration to fail"
            exit 1
          fi

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      VECTOR_DIMENSIONS: "2"
      RUN_PGVECTOR_INTEGRATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-production.txt -r requirements-dev.txt

      - name: Run pgvector integration tests
        run: python -m unittest tests.test_pgvector_integration -v
