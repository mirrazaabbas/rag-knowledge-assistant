[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["api", "providers"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "def main\\(\\) -> None:",
  "if __name__ == .__main__.:",
]
