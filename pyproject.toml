[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-assistant"
version = "1.0.0"
description = "Source-grounded RAG retrieval with FastAPI, pgvector, citations and observability."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Mir Raza Abbas"}]
keywords = ["rag", "pgvector", "fastapi", "retrieval", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
]

[project.optional-dependencies]
production = [
  "psycopg[binary,pool]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "opentelemetry-api>=1.27,<2.0",
  "opentelemetry-sdk>=1.27,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
]

[project.scripts]
rag-search = "app:main"
rag-benchmark = "benchmark:main"

[project.urls]
Homepage = "https://github.com/mirrazaabbas/rag-knowledge-assistant"
Repository = "https://github.com/mirrazaabbas/rag-knowledge-assistant"
Issues = "https://github.com/mirrazaabbas/rag-knowledge-assistant/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
  "app",
  "api",
  "providers",
  "storage",
  "benchmark",
  "observability",
  "integration_contract",
  "ai_features",
  "ai_platform",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
branch = true
source = ["api", "providers", "integration_contract"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
  "def main\\(\\) -> None:",
  "if __name__ == .__main__.:",
]
