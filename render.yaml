services:
  - type: web
    name: rag-knowledge-assistant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-knowledge-assistant-db
          property: connectionString
      - key: VECTOR_DIMENSIONS
        value: "1536"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: CHAT_MODEL
        value: gpt-4.1-mini
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "30"
      - key: OTEL_ENABLED
        value: "false"
      - key: OTEL_SERVICE_NAME
        value: rag-knowledge-assistant

databases:
  - name: rag-knowledge-assistant-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: rag
    user: rag
    ipAllowList: []
